services:
  postgres:
    image: postgres:16-alpine
    container_name: cricketpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cricket
      POSTGRES_USER: cricket_app
      POSTGRES_PASSWORD: cricket_dev_password
    ports:
      - "5432:5432"
    volumes:
      - cricket_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cricket_app -d cricket"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cricket_postgres_data:
