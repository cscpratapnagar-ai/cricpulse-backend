services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cricket}
      POSTGRES_USER: ${POSTGRES_USER:-cricket_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes: [cricket_postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U $${POSTGRES_USER:-cricket_app} -d $${POSTGRES_DB:-cricket}"]
      interval: 5s
      timeout: 5s
      retries: 10
  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    command: ["sh","-c","rabbitmq-plugins enable --offline rabbitmq_stomp && rabbitmq-server"]
    healthcheck:
      test: ["CMD-SHELL","rabbitmq-diagnostics -q ping && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/cscpratapnagar-ai/cricpulse-backend:${BACKEND_TAG:-main}}
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cricket}
      DATABASE_USERNAME: ${POSTGRES_USER:-cricket_app}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-86400}
      WEBSOCKET_BROKER_RELAY_ENABLED: "true"
      WEBSOCKET_BROKER_RELAY_HOST: rabbitmq
      WEBSOCKET_BROKER_RELAY_PORT: 61613
      WEBSOCKET_BROKER_RELAY_CLIENT_LOGIN: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      WEBSOCKET_BROKER_RELAY_CLIENT_PASSCODE: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      WEBSOCKET_BROKER_RELAY_SYSTEM_LOGIN: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      WEBSOCKET_BROKER_RELAY_SYSTEM_PASSCODE: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      WEBSOCKET_BROKER_RELAY_VIRTUAL_HOST: ${RABBITMQ_VHOST:-/}
      PORT: 8080
    ports: ["127.0.0.1:${API_HEALTH_PORT:-8081}:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://127.0.0.1:8080/actuator/health/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/cscpratapnagar-ai/cricpulse-ui:${FRONTEND_TAG:-main}}
    restart: unless-stopped
    ports: ["${HTTP_PORT:-80}:80"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  cricket_postgres_data:
