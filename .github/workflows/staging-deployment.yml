name: Staging Deployment
on:
  workflow_dispatch:
    inputs:
      backend_tag:
        description: Immutable backend image tag (sha-<commit>)
        required: true
        type: string
      frontend_tag:
        description: Immutable frontend image tag (sha-<commit>)
        required: true
        type: string
      backup_file:
        description: Absolute path to a verified staging PostgreSQL dump created within 24 hours
        required: true
        type: string
      match_id:
        description: Optional staging match UUID for broadcast snapshot verification
        required: false
        type: string
permissions:
  contents: read
  packages: read
  attestations: read
concurrency:
  group: cricpulse-staging-deployment
  cancel-in-progress: false
jobs:
  deploy:
    name: Verify, deploy, smoke-test, and rollback staging
    # Staging environment secrets are exposed only to the trusted release branch.
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4
      - name: Validate immutable tags and isolated staging configuration
        env:
          BACKEND_TAG: ${{ inputs.backend_tag }}
          FRONTEND_TAG: ${{ inputs.frontend_tag }}
          DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.STAGING_DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_APP_DIR: ${{ secrets.STAGING_DEPLOY_APP_DIR }}
          API_URL: ${{ secrets.STAGING_API_BASE_URL }}
          APP_URL: ${{ secrets.STAGING_APP_URL }}
          ACTUATOR_URL: ${{ secrets.STAGING_ACTUATOR_URL }}
        run: |
          set -euo pipefail
          [[ "$BACKEND_TAG" =~ ^sha-[0-9a-f]{7,40}$ ]] || { echo "Invalid backend immutable tag" >&2; exit 1; }
          [[ "$FRONTEND_TAG" =~ ^sha-[0-9a-f]{7,40}$ ]] || { echo "Invalid frontend immutable tag" >&2; exit 1; }
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_PRIVATE_KEY DEPLOY_SSH_KNOWN_HOSTS DEPLOY_APP_DIR API_URL APP_URL ACTUATOR_URL; do
            [[ -n "${!name}" ]] || { echo "Missing required staging environment secret: $name" >&2; exit 1; }
          done
          [[ "$DEPLOY_APP_DIR" =~ ^/[a-zA-Z0-9_./-]+/staging$ ]] || { echo "STAGING_DEPLOY_APP_DIR must be a dedicated absolute path ending in /staging" >&2; exit 1; }
          [[ "$API_URL" == https://* && "$APP_URL" == https://* && "$ACTUATOR_URL" == https://* ]] || { echo "All staging public endpoints must use HTTPS" >&2; exit 1; }
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx for immutable digest resolution
        uses: docker/setup-buildx-action@v3
      - name: Verify backend image provenance and resolve immutable digest
        id: backend_image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_TAG: ${{ inputs.backend_tag }}
        run: bash scripts/verify-production-image-attestation.sh "$BACKEND_TAG"
      - name: Verify frontend image provenance and resolve immutable digest
        id: frontend_image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_TAG: ${{ inputs.frontend_tag }}
        run: bash scripts/verify-frontend-image-attestation.sh "$FRONTEND_TAG"
      - name: Configure pinned staging SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/cricpulse_staging"
          chmod 600 "$HOME/.ssh/cricpulse_staging"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Transfer staging-only deployment bundle
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          DEPLOY_APP_DIR: ${{ secrets.STAGING_DEPLOY_APP_DIR }}
        run: |
          set -euo pipefail
          SSH=(ssh -i "$HOME/.ssh/cricpulse_staging" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          SCP=(scp -i "$HOME/.ssh/cricpulse_staging" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          "${SSH[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_APP_DIR/release-tools'"
          "${SCP[@]}" docker-compose.staging.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_APP_DIR/"
          "${SCP[@]}" scripts/staging-deployment-smoke.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_APP_DIR/release-tools/"
          "${SCP[@]}" scripts/staging-backup-restore-rehearsal.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_APP_DIR/release-tools/"
          "${SSH[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "chmod 700 '$DEPLOY_APP_DIR/release-tools/staging-deployment-smoke.sh' '$DEPLOY_APP_DIR/release-tools/staging-backup-restore-rehearsal.sh'"
      - name: Run remote staging host bootstrap preflight
        id: staging_preflight
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          DEPLOY_APP_DIR: ${{ secrets.STAGING_DEPLOY_APP_DIR }}
          BACKEND_DIGEST: ${{ steps.backend_image.outputs.image_digest }}
          FRONTEND_DIGEST: ${{ steps.frontend_image.outputs.image_digest }}
          BACKUP_FILE: ${{ inputs.backup_file }}
        run: |
          set -euo pipefail
          [[ "$BACKEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Backend digest output is invalid" >&2; exit 1; }
          [[ "$FRONTEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Frontend digest output is invalid" >&2; exit 1; }
          BACKEND_IMAGE="ghcr.io/cscpratapnagar-ai/cricpulse-backend@$BACKEND_DIGEST"
          FRONTEND_IMAGE="ghcr.io/cscpratapnagar-ai/cricpulse-ui@$FRONTEND_DIGEST"
          printf -v REMOTE_PREFLIGHT '%q ' bash -s -- "$DEPLOY_APP_DIR" "$BACKUP_FILE" "$BACKEND_IMAGE" "$FRONTEND_IMAGE"
          ssh -i "$HOME/.ssh/cricpulse_staging" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "$REMOTE_PREFLIGHT" < scripts/staging-host-preflight.sh
      - name: Deploy staging with automatic rollback
        id: deploy_staging
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          DEPLOY_APP_DIR: ${{ secrets.STAGING_DEPLOY_APP_DIR }}
          BACKEND_DIGEST: ${{ steps.backend_image.outputs.image_digest }}
          FRONTEND_DIGEST: ${{ steps.frontend_image.outputs.image_digest }}
          BACKUP_FILE: ${{ inputs.backup_file }}
          API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
          APP_URL: ${{ secrets.STAGING_APP_URL }}
          ACTUATOR_URL: ${{ secrets.STAGING_ACTUATOR_URL }}
          MATCH_ID: ${{ inputs.match_id }}
        run: |
          set -euo pipefail
          [[ "$BACKEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Backend digest output is invalid" >&2; exit 1; }
          [[ "$FRONTEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Frontend digest output is invalid" >&2; exit 1; }
          printf -v REMOTE_COMMAND '%q ' bash -s -- "$DEPLOY_APP_DIR" "$BACKEND_DIGEST" "$FRONTEND_DIGEST" "$BACKUP_FILE" "$API_BASE_URL" "$APP_URL" "$ACTUATOR_URL" "${MATCH_ID:-}"
          ssh -i "$HOME/.ssh/cricpulse_staging" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "$REMOTE_COMMAND" < scripts/staging-deploy-with-rollback.sh

      - name: Generate sanitized staging release evidence
        if: always()
        env:
          BACKEND_TAG: ${{ inputs.backend_tag }}
          FRONTEND_TAG: ${{ inputs.frontend_tag }}
          BACKEND_DIGEST: ${{ steps.backend_image.outputs.image_digest }}
          FRONTEND_DIGEST: ${{ steps.frontend_image.outputs.image_digest }}
          BACKEND_VERIFY_OUTCOME: ${{ steps.backend_image.outcome }}
          FRONTEND_VERIFY_OUTCOME: ${{ steps.frontend_image.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.staging_preflight.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy_staging.outcome }}
          WORKFLOW_STATUS: ${{ job.status }}
          EVIDENCE_FILE: ${{ runner.temp }}/staging-release-evidence.md
        run: bash scripts/write-staging-release-evidence.sh

      - name: Upload staging release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging-release-evidence.md
          if-no-files-found: ignore
          retention-days: 90
