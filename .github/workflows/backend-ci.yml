name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  DATABASE_URL: jdbc:postgresql://localhost:5432/cricket
  DATABASE_USERNAME: cricket_app
  DATABASE_PASSWORD: cricket_dev_password
  JWT_SECRET: ci-only-cricpulse-jwt-secret-change-me-2026
  # CI runs the API over localhost HTTP; production must keep Secure cookies enabled behind HTTPS.
  AUTH_COOKIE_SECURE: 'false'
  PORT: 8080

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cricket
          POSTGRES_USER: cricket_app
          POSTGRES_PASSWORD: cricket_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cricket_app -d cricket"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate E2E script syntax
        run: |
          bash -n scripts/seed-qualification-test-data.sh
          bash -n scripts/e2e-double-round-robin-regression.sh
          bash -n scripts/e2e-scoring-idempotency-retry.sh
          bash -n scripts/e2e-broadcast-performance-recovery.sh
          bash -n scripts/production-release-preflight.sh
          bash -n scripts/production-deployment-smoke.sh
          bash -n scripts/postgres-backup-restore-certification.sh
          bash -n scripts/production-deploy-with-rollback.sh
          bash -n scripts/test-production-deploy-rollback.sh
          bash -n scripts/verify-production-image-attestation.sh
          bash -n scripts/test-production-image-attestation.sh
          bash -n scripts/staging-deployment-smoke.sh
          bash -n scripts/staging-deploy-with-rollback.sh
          bash -n scripts/test-staging-deployment.sh
          bash -n scripts/verify-frontend-image-attestation.sh
          bash -n scripts/test-frontend-image-attestation.sh
          node --check scripts/e2e-scoring-websocket.mjs

      - name: Verify production deployment success and rollback paths
        run: bash scripts/test-production-deploy-rollback.sh

      - name: Verify production image provenance enforcement
        run: bash scripts/test-production-image-attestation.sh

      - name: Verify frontend production image provenance enforcement
        run: bash scripts/test-frontend-image-attestation.sh

      - name: Verify staging deployment and rollback paths
        run: bash scripts/test-staging-deployment.sh

      - name: Set up Node.js for WebSocket runtime E2E
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U cricket_app -d cricket; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready" >&2
          exit 1

      - name: Run tests
        run: mvn -B test

      - name: Build application
        run: mvn -B package -DskipTests

      - name: Build production container
        run: docker build --tag cricpulse-backend:ci .
      - name: Validate isolated staging compose
        env:
          POSTGRES_PASSWORD: Staging-Only-Secret-123456
          JWT_SECRET: staging-jwt-secret-at-least-32-bytes-long
          BACKEND_TAG: sha-abcdef1
          FRONTEND_TAG: sha-1234567
        run: docker compose -f docker-compose.staging.yml config --quiet

      - name: Validate production compose
        env:
          POSTGRES_PASSWORD: Preflight-Only-Secret-7c29a4b6
          JWT_SECRET: ci-jwt-secret-at-least-32-bytes-long
        run: docker compose -f docker-compose.production.yml config --quiet

      - name: Run production release preflight guard
        env:
          POSTGRES_PASSWORD: Preflight-Only-Secret-7c29a4b6
          JWT_SECRET: ci-jwt-secret-at-least-32-bytes-long
          BACKEND_TAG: sha-abcdef1
          FRONTEND_TAG: sha-1234567
        run: bash scripts/production-release-preflight.sh

      - name: Verify mutable image tags are rejected
        env:
          POSTGRES_PASSWORD: Preflight-Only-Secret-7c29a4b6
          JWT_SECRET: ci-jwt-secret-at-least-32-bytes-long
          BACKEND_TAG: main
          FRONTEND_TAG: sha-1234567
        run: |
          if bash scripts/production-release-preflight.sh; then
            echo "Release preflight unexpectedly accepted the mutable main tag" >&2
            exit 1
          fi
          echo "PASS: mutable production image tags are rejected"

      - name: Start application
        run: |
          nohup java -jar target/*.jar > "$RUNNER_TEMP/cricpulse-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/cricpulse-api.pid"
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null; then
              echo "CricPulse API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "CricPulse API did not become healthy" >&2
          cat "$RUNNER_TEMP/cricpulse-api.log" >&2 || true
          exit 1

      - name: Install PostgreSQL 16 client tools for server-version compatibility
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo \"$VERSION_CODENAME\")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          pg_dump --version

      - name: Certify PostgreSQL backup and isolated restore
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: cricket_app
          PGPASSWORD: cricket_dev_password
          PGDATABASE: cricket
          BACKUP_FILE: ${{ runner.temp }}/cricpulse-ci-backup.dump
        run: bash scripts/postgres-backup-restore-certification.sh

      - name: Seed disposable HTTP lifecycle fixtures
        env:
          E2E_PASSWORD: ${{ secrets.CRICPULSE_E2E_PASSWORD }}
        run: bash scripts/ci-http-lifecycle-setup.sh

      - name: Verify owner data isolation
        env:
          BASE_URL: http://localhost:8080/api
          E2E_EMAIL: ${{ env.E2E_EMAIL }}
          E2E_OWNER_B_EMAIL: ${{ env.E2E_OWNER_B_EMAIL }}
          E2E_PASSWORD: ${{ env.E2E_PASSWORD }}
          E2E_TEAM_A_ID: ${{ env.E2E_TEAM_A_ID }}
          E2E_TEAM_B_ID: ${{ env.E2E_TEAM_B_ID }}
          E2E_B_OWNER_PLAYER_ID: ${{ env.E2E_B_OWNER_PLAYER_ID }}
          E2E_PRIVATE_MATCH_ID: ${{ env.E2E_PRIVATE_MATCH_ID }}
          E2E_PRIVATE_TEAM_B2_ID: ${{ env.E2E_PRIVATE_TEAM_B2_ID }}
        run: bash scripts/e2e-owner-data-isolation.sh

      - name: Run HTTP + WebSocket scoring idempotency and rollback E2E
        env:
          BASE_URL: http://localhost:8080/api
          EMAIL: ${{ env.E2E_EMAIL }}
          OWNER_B_EMAIL: ${{ env.E2E_OWNER_B_EMAIL }}
          PASSWORD: ${{ env.E2E_PASSWORD }}
          MATCH_ID: ${{ env.E2E_MATCH_ID }}
          TEAM_A_ID: ${{ env.E2E_TEAM_A_ID }}
          TEAM_B_ID: ${{ env.E2E_TEAM_B_ID }}
          A_STRIKER_ID: ${{ env.E2E_OWNER_PLAYER_ID }}
          A_NON_STRIKER_ID: ${{ env.E2E_PLAYER_ID }}
          B_BOWLER_ID: ${{ env.E2E_B_PLAYER_ID }}
        run: bash scripts/e2e-scoring-idempotency-retry.sh

      - name: Run complete match lifecycle E2E
        env:
          BASE_URL: http://localhost:8080/api
          EMAIL: ${{ env.E2E_EMAIL }}
          OWNER_B_EMAIL: ${{ env.E2E_OWNER_B_EMAIL }}
          PASSWORD: ${{ env.E2E_PASSWORD }}
          MATCH_ID: ${{ env.E2E_MATCH_ID }}
          TEAM_A_ID: ${{ env.E2E_TEAM_A_ID }}
          TEAM_B_ID: ${{ env.E2E_TEAM_B_ID }}
          A_STRIKER_ID: ${{ env.E2E_OWNER_PLAYER_ID }}
          A_NON_STRIKER_ID: ${{ env.E2E_PLAYER_ID }}
          B_BOWLER_ID: ${{ env.E2E_B_PLAYER_ID }}
          B_STRIKER_ID: ${{ env.E2E_B_OWNER_PLAYER_ID }}
          B_NON_STRIKER_ID: ${{ env.E2E_B_PLAYER_ID }}
          A_BOWLER_ID: ${{ env.E2E_OWNER_PLAYER_ID }}
        run: bash scripts/e2e-real-scoring-match.sh

      - name: Run deployment smoke checks against the live CI API
        env:
          API_BASE_URL: http://localhost:8080
          ACTUATOR_URL: http://localhost:8080/actuator/health/readiness
          REQUIRE_HTTPS: 'false'
          MATCH_ID: ${{ env.E2E_MATCH_ID }}
        run: bash scripts/production-deployment-smoke.sh

      - name: Seed disposable tournament fixtures
        env:
          EMAIL: ${{ env.E2E_EMAIL }}
          PASSWORD: ${{ env.E2E_PASSWORD }}
        run: bash scripts/ci-tournament-setup.sh

      - name: Run tournament delegated-manager access E2E
        env:
          BASE_URL: http://localhost:8080/api
          E2E_EMAIL: ${{ env.E2E_EMAIL }}
          E2E_OWNER_B_EMAIL: ${{ env.E2E_OWNER_B_EMAIL }}
          E2E_PASSWORD: ${{ env.E2E_PASSWORD }}
          E2E_TOURNAMENT_ID: ${{ env.E2E_TOURNAMENT_ID }}
        run: bash scripts/e2e-tournament-manager-access.sh

      - name: Run tournament fixture hardening E2E
        env:
          BASE_URL: http://localhost:8080/api
          EMAIL: ${{ env.E2E_EMAIL }}
          PASSWORD: ${{ env.E2E_PASSWORD }}
          TOURNAMENT_ID: ${{ env.E2E_TOURNAMENT_ID }}
        run: bash scripts/e2e-tournament-hardening.sh

      - name: Run single and double round-robin regression E2E
        env:
          BASE_URL: http://localhost:8080/api
          EMAIL: ${{ env.E2E_EMAIL }}
          PASSWORD: ${{ env.E2E_PASSWORD }}
        run: bash scripts/e2e-double-round-robin-regression.sh

      - name: Run tournament scheduling hardening E2E
        env:
          BASE_URL: http://localhost:8080/api
          EMAIL: ${{ env.E2E_EMAIL }}
          PASSWORD: ${{ env.E2E_PASSWORD }}
          TOURNAMENT_ID: ${{ env.E2E_TOURNAMENT_ID }}
          FIXTURE_A_ID: ${{ env.E2E_FIXTURE_A_ID }}
          FIXTURE_B_ID: ${{ env.E2E_FIXTURE_B_ID }}
        run: bash scripts/e2e-tournament-scheduling-hardening.sh
      - name: Run tournament playoff progression E2E
        env:
          BASE_URL: http://localhost:8080/api
          EMAIL: ${{ env.E2E_EMAIL }}
          PASSWORD: ${{ env.E2E_PASSWORD }}
          TOURNAMENT_ID: ${{ env.E2E_TOURNAMENT_ID }}
          DATABASE_USERNAME: ${{ env.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ env.DATABASE_PASSWORD }}
        run: bash scripts/e2e-tournament-playoff-progression.sh

      - name: Run broadcast performance and API recovery E2E
        env:
          BASE_URL: http://localhost:8080/api
          MATCH_ID: ${{ env.E2E_MATCH_ID }}
          API_PID_FILE: ${{ runner.temp }}/cricpulse-api.pid
          API_LOG_FILE: ${{ runner.temp }}/cricpulse-api.log
        run: bash scripts/e2e-broadcast-performance-recovery.sh

      - name: Upload API log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cricpulse-api-log
          path: ${{ runner.temp }}/cricpulse-api.log
          if-no-files-found: ignore

      - name: Stop application
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/cricpulse-api.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/cricpulse-api.pid")" 2>/dev/null || true
          fi
