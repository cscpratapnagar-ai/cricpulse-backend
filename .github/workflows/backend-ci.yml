name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  DATABASE_URL: jdbc:postgresql://localhost:5432/cricket
  DATABASE_USERNAME: cricket_app
  DATABASE_PASSWORD: cricket_dev_password
  JWT_SECRET: ci-only-cricpulse-jwt-secret-change-me-2026
  PORT: 8080

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cricket
          POSTGRES_USER: cricket_app
          POSTGRES_PASSWORD: cricket_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cricket_app -d cricket"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U cricket_app -d cricket; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready" >&2
          exit 1

      - name: Run tests
        run: mvn -B test

      - name: Build application
        run: mvn -B package -DskipTests

      - name: Start application
        run: |
          nohup java -jar target/*.jar > "$RUNNER_TEMP/cricpulse-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/cricpulse-api.pid"
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null; then
              echo "CricPulse API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "CricPulse API did not become healthy" >&2
          cat "$RUNNER_TEMP/cricpulse-api.log" >&2 || true
          exit 1

      - name: Seed disposable HTTP lifecycle fixtures
        env:
          E2E_PASSWORD: ${{ secrets.CRICPULSE_E2E_PASSWORD }}
        run: bash scripts/ci-http-lifecycle-setup.sh

      - name: Run complete match lifecycle E2E
        env:
          BASE_URL: http://localhost:8080/api
          EMAIL: ${{ env.E2E_EMAIL }}
          PASSWORD: ${{ env.E2E_PASSWORD }}
          MATCH_ID: ${{ env.E2E_MATCH_ID }}
          TEAM_A_ID: ${{ env.E2E_TEAM_A_ID }}
          TEAM_B_ID: ${{ env.E2E_TEAM_B_ID }}
          A_STRIKER_ID: ${{ env.E2E_OWNER_PLAYER_ID }}
          A_NON_STRIKER_ID: ${{ env.E2E_PLAYER_ID }}
          B_BOWLER_ID: ${{ env.E2E_B_PLAYER_ID }}
          B_STRIKER_ID: ${{ env.E2E_B_OWNER_PLAYER_ID }}
          B_NON_STRIKER_ID: ${{ env.E2E_B_PLAYER_ID }}
          A_BOWLER_ID: ${{ env.E2E_OWNER_PLAYER_ID }}
        run: bash scripts/e2e-real-scoring-match.sh

      - name: Seed disposable tournament fixtures
        env:
          EMAIL: ${{ env.E2E_EMAIL }}
          PASSWORD: ${{ env.E2E_PASSWORD }}
        run: bash scripts/ci-tournament-setup.sh

      - name: Run tournament fixture hardening E2E
        env:
          BASE_URL: http://localhost:8080/api
          EMAIL: ${{ env.E2E_EMAIL }}
          PASSWORD: ${{ env.E2E_PASSWORD }}
          TOURNAMENT_ID: ${{ env.E2E_TOURNAMENT_ID }}
        run: bash scripts/e2e-tournament-hardening.sh

      - name: Run tournament scheduling hardening E2E
        env:
          BASE_URL: http://localhost:8080/api
          EMAIL: ${{ env.E2E_EMAIL }}
          PASSWORD: ${{ env.E2E_PASSWORD }}
          TOURNAMENT_ID: ${{ env.E2E_TOURNAMENT_ID }}
          FIXTURE_A_ID: ${{ env.E2E_FIXTURE_A_ID }}
          FIXTURE_B_ID: ${{ env.E2E_FIXTURE_B_ID }}
        run: bash scripts/e2e-tournament-scheduling-hardening.sh

      - name: Upload API log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cricpulse-api-log
          path: ${{ runner.temp }}/cricpulse-api.log
          if-no-files-found: ignore

      - name: Stop application
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/cricpulse-api.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/cricpulse-api.pid")" 2>/dev/null || true
          fi
