name: Production Deployment

on:
  workflow_dispatch:
    inputs:
      backend_tag:
        description: Immutable backend image tag (sha-<commit>)
        required: true
        type: string
      frontend_tag:
        description: Immutable frontend image tag (sha-<commit>)
        required: true
        type: string
      backup_file:
        description: Absolute path to a verified pre-deployment PostgreSQL dump (created within 24 hours)
        required: true
        type: string
      match_id:
        description: Optional public match UUID for broadcast snapshot smoke check
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cricpulse-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify production release
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      - name: Validate release inputs and deployment secrets
        env:
          BACKEND_TAG: ${{ inputs.backend_tag }}
          FRONTEND_TAG: ${{ inputs.frontend_tag }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          PRODUCTION_API_BASE_URL: ${{ secrets.PRODUCTION_API_BASE_URL }}
          PRODUCTION_ACTUATOR_URL: ${{ secrets.PRODUCTION_ACTUATOR_URL }}
        run: |
          set -euo pipefail
          [[ "$BACKEND_TAG" =~ ^sha-[0-9a-f]{7,40}$ ]] || { echo "Invalid backend immutable tag" >&2; exit 1; }
          [[ "$FRONTEND_TAG" =~ ^sha-[0-9a-f]{7,40}$ ]] || { echo "Invalid frontend immutable tag" >&2; exit 1; }
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_PRIVATE_KEY DEPLOY_SSH_KNOWN_HOSTS DEPLOY_APP_DIR PRODUCTION_API_BASE_URL PRODUCTION_ACTUATOR_URL; do
            [[ -n "${!name}" ]] || { echo "Missing required environment secret: $name" >&2; exit 1; }
          done
          [[ "$DEPLOY_APP_DIR" =~ ^/[a-zA-Z0-9_./-]+$ ]] || { echo "DEPLOY_APP_DIR must be a safe absolute path" >&2; exit 1; }
          [[ "$PRODUCTION_API_BASE_URL" == https://* ]] || { echo "Production API URL must use HTTPS" >&2; exit 1; }

      - name: Configure pinned SSH access
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/cricpulse_deploy"
          chmod 600 "$HOME/.ssh/cricpulse_deploy"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Transfer immutable deployment bundle
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
        run: |
          set -euo pipefail
          SSH=(ssh -i "$HOME/.ssh/cricpulse_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          SCP=(scp -i "$HOME/.ssh/cricpulse_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          "${SSH[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_APP_DIR/release-tools'"
          "${SCP[@]}" docker-compose.production.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_APP_DIR/"
          "${SCP[@]}" scripts/production-release-preflight.sh scripts/production-deployment-smoke.sh scripts/postgres-backup-restore-certification.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_APP_DIR/release-tools/"

      - name: Deploy, verify, and automatically roll back on failure
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          BACKEND_TAG: ${{ inputs.backend_tag }}
          FRONTEND_TAG: ${{ inputs.frontend_tag }}
          BACKUP_FILE: ${{ inputs.backup_file }}
          API_BASE_URL: ${{ secrets.PRODUCTION_API_BASE_URL }}
          APP_URL: ${{ secrets.PRODUCTION_APP_URL }}
          ACTUATOR_URL: ${{ secrets.PRODUCTION_ACTUATOR_URL }}
          MATCH_ID: ${{ inputs.match_id }}
        run: |
          set -euo pipefail
          printf -v REMOTE_COMMAND '%q ' bash -s -- "$DEPLOY_APP_DIR" "$BACKEND_TAG" "$FRONTEND_TAG" "$BACKUP_FILE" "$API_BASE_URL" "${APP_URL:-}" "$ACTUATOR_URL" "${MATCH_ID:-}"
          ssh -i "$HOME/.ssh/cricpulse_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "$REMOTE_COMMAND" < scripts/production-deploy-with-rollback.sh
