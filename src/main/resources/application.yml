spring:
  application:
    name: cricketpulse-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cricket}
    username: ${DATABASE_USERNAME:cricket_app}
    password: ${DATABASE_PASSWORD:cricket_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

security:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value-123456}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}

management:
  endpoints:
    web:
      exposure:
        include: health,info
