app:
  cors:
    allowed-origin-patterns: http://localhost:4200,https://*.app.github.dev,https://*.cricketpulse.app

spring:
  application:
    name: cricketpulse-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${CRICPULSE_PGHOST:localhost}:${CRICPULSE_PGPORT:5432}/${CRICPULSE_PGDATABASE:cricket}?sslmode=${CRICPULSE_PGSSLMODE:disable}}
    username: ${DATABASE_USERNAME:${CRICPULSE_PGUSER:cricket_app}}
    password: ${DATABASE_PASSWORD:${CRICPULSE_PGPASSWORD:cricket_dev_password}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

server:
  port: ${PORT:8080}
  shutdown: graceful

payments:
  webhook:
    # Configure only after selecting and onboarding a real gateway.
    secret: ${PAYMENT_WEBHOOK_SECRET:}

security:
  jwt:
    # Local Maven runs can start without manually exporting a secret. Production
    # deployments still provide JWT_SECRET explicitly through docker-compose.
    secret: ${JWT_SECRET:local-only-cricpulse-jwt-secret-change-me-2026}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  pattern:
    level: "%5p [requestId:%X{requestId}]"
